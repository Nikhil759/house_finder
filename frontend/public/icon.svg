<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="100" fill="#0f0f13"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#f5a623" stroke-width="16"/>
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#f5a623" stroke-width="12" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="40" fill="#f5a623"/>
  <!-- Arm -->
  <line x1="256" y1="256" x2="448" y2="96" stroke="#f5a623" stroke-width="14" opacity="0.8" stroke-linecap="round"/>
</svg>
