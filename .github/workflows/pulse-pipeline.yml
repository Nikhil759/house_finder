# Pulse pipeline — manual fallback only.
# Production crons run on Railway (see backend/scripts/run_pulse_railway_cron.sh).

name: Pulse Pipeline

on:
  workflow_dispatch: {}

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Pulse pipeline (Railway subset — no Reddit)
        working-directory: backend
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ingestion.run_all pulse_railway
